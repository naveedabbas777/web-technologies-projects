<div class="create-edit-post-card">
  <h1 class="section-title">Create New Video Post</h1>

  @if (errorMessage) {
    <div class="alert alert-danger">
      <i class="fas fa-exclamation-triangle"></i>
      {{ errorMessage }}
    </div>
  }

  @if (successMessage) {
    <div class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      {{ successMessage }}
    </div>
  }

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Title</label>
      <input type="text" class="input" [(ngModel)]="title" name="title" required />
    </div>
    <div class="form-group">
      <label>Video</label>
      <input type="file" accept="video/*" (change)="onFileSelected($event)" required />
      @if (video) {
        <div class="file-info">
          <i class="fas fa-video"></i>
          <span>{{ video.name }}</span>
          <small>({{ (video.size / (1024 * 1024)).toFixed(2) }} MB)</small>
        </div>
      }
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="textarea" [(ngModel)]="description" name="description" required></textarea>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn primary" [disabled]="loading">
        @if (loading) {
          <i class="fas fa-spinner fa-spin"></i> Uploading Video...
        } @else {
          <i class="fas fa-video"></i> Create Video Post
        }
      </button>
    </div>
  </form>
</div>
