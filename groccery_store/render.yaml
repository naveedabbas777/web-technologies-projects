services:
  - type: web
    name: fresh-grocery-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_TYPE
        value: mongodb
      - key: PORT
        value: 10000
      - key: JWT_EXPIRY
        value: 7d
      # Set these in Render dashboard (do not hardcode secrets)
      # - MONGODB_URI
      # - JWT_SECRET
      # - FRONTEND_URL
      # - CORS_ORIGINS

  - type: static
    name: fresh-grocery-frontend
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend web URL + /api
      # Example: https://fresh-grocery-backend.onrender.com/api
      - key: VITE_API_BASE
        value: https://fresh-grocery-backend.onrender.com/api
