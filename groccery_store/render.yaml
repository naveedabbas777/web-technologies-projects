services:
  - type: web
    name: fresh-grocery-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_TYPE
        value: mongodb
      - key: PORT
        value: 10000
      # Required secrets in Render dashboard:
      # - key: MONGODB_URI
      #   value: mongodb+srv://<user>:<password>@<cluster>/<db>?retryWrites=true&w=majority
      # - key: JWT_SECRET
      #   value: <strong-random-secret>
      # - key: CLOUDINARY_CLOUD_NAME
      #   value: <cloud-name>
      # - key: CLOUDINARY_API_KEY
      #   value: <api-key>
      # - key: CLOUDINARY_API_SECRET
      #   value: <api-secret>
      # - key: FRONTEND_URL
      #   value: https://fresh-grocery-frontend.onrender.com
      # - key: CORS_ORIGINS
      #   value: https://fresh-grocery-frontend.onrender.com
      - key: JWT_EXPIRY
        value: 7d

  - type: static
    name: fresh-grocery-frontend
    rootDir: frontend-react
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://fresh-grocery-backend.onrender.com/api
